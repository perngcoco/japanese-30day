<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f7fb">
<title>30天日文自學｜iPad版</title>
<style>
:root {
  --bg:#f7f7fb; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --accent:#356ae6;
  --soft:#eef3ff; --ok:#16794b; --border:#e6e6eb; --shadow:0 8px 28px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
.app{max-width:1100px;margin:0 auto;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}
header{padding:22px 4px 14px;display:flex;gap:14px;align-items:end;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,42px);margin:0;letter-spacing:-.03em}
.subtitle{color:var(--muted);margin-top:6px}
.progress-wrap{min-width:260px}
.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:7px}
.progress{height:10px;background:#e9e9ef;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:.25s}
.layout{display:grid;grid-template-columns:270px 1fr;gap:18px}
.sidebar,.panel{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:22px}
.sidebar{padding:12px;position:sticky;top:12px;height:calc(100vh - 24px);overflow:auto}
.daybtn{width:100%;text-align:left;border:0;background:transparent;padding:12px 13px;border-radius:14px;margin:2px 0;display:flex;justify-content:space-between;gap:8px}
.daybtn:hover,.daybtn.active{background:var(--soft)}
.daybtn .dtitle{font-weight:650}
.daybtn .tiny{font-size:12px;color:var(--muted);margin-top:2px}
.check{font-size:18px;color:var(--ok)}
.panel{padding:24px}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.badge{display:inline-block;background:var(--soft);color:var(--accent);padding:7px 11px;border-radius:999px;font-weight:650;font-size:14px}
h2{font-size:clamp(24px,3.2vw,34px);margin:10px 0 6px}
.focus{color:var(--muted);font-size:17px}
.speak-all,.done,.quizbtn{border:0;border-radius:14px;padding:12px 16px;min-height:48px;font-weight:700}
.speak-all{background:var(--accent);color:#fff}
.done{background:#eff8f3;color:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.kana-card{border:1px solid var(--border);border-radius:18px;padding:16px;min-height:155px;display:flex;flex-direction:column;justify-content:space-between}
.kana{font-size:40px;font-weight:750;line-height:1}
.romaji{font-size:14px;color:var(--muted);margin-top:4px}
.word{font-size:20px;font-weight:700;margin-top:12px}
.meaning{color:var(--muted);font-size:14px}
.speaker{margin-top:10px;border:0;background:#f3f4f6;border-radius:12px;padding:9px 10px;min-height:42px}
.example,.quiz{margin-top:18px;padding:18px;border-radius:18px;background:#fafafa;border:1px solid var(--border)}
.example .jp{font-size:25px;font-weight:700;margin:6px 0}
.example .zh{color:var(--muted)}
.tip{margin-top:16px;color:#4a4a4f;line-height:1.7}
.quizq{font-size:18px;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.quizbtn{background:#f2f3f5;color:var(--text);text-align:left}
.quizbtn.correct{background:#e9f7ef;color:#0d6b3e}
.quizbtn.wrong{background:#fdeeee;color:#a22}
.footer-note{color:var(--muted);font-size:13px;margin-top:20px;line-height:1.6}
.mobile-days{display:none;margin:0 0 14px}
select{width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:16px}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-days{display:block}
  .panel{padding:18px}
  .choices{grid-template-columns:1fr}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111214;--card:#1b1c1f;--text:#f4f4f5;--muted:#a1a1a6;--soft:#202b45;--border:#2d2f33}
  .example,.quiz{background:#16171a}
  .speaker,.quizbtn{background:#27292e;color:var(--text)}
  select{background:#1b1c1f;color:var(--text)}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>30天日文自學</h1>
    <div class="subtitle">0 基礎・每天 30 分鐘・iPad 觸控版</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta"><span>完成進度</span><span id="progressText">0 / 30</span></div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>
</header>

<div class="mobile-days"><select id="daySelect" aria-label="選擇學習日"></select></div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="panel" id="panel"></main>
</div>
</div>

<script>
const DAYS = [{"day": 1, "title": "あ行", "focus": "あ・い・う・え・お", "items": [["あ", "a", "あさ", "早上"], ["い", "i", "いえ", "家"], ["う", "u", "うえ", "上面"], ["え", "e", "えき", "車站"], ["お", "o", "おと", "聲音"]], "sentence": "おはよう。", "meaning": "早安。"}, {"day": 2, "title": "か行", "focus": "か・き・く・け・こ", "items": [["か", "ka", "かさ", "雨傘"], ["き", "ki", "き", "樹"], ["く", "ku", "くち", "嘴巴"], ["け", "ke", "けさ", "今天早上"], ["こ", "ko", "ここ", "這裡"]], "sentence": "ここです。", "meaning": "在這裡。"}, {"day": 3, "title": "さ行", "focus": "さ・し・す・せ・そ", "items": [["さ", "sa", "さかな", "魚"], ["し", "shi", "しお", "鹽"], ["す", "su", "すし", "壽司"], ["せ", "se", "せかい", "世界"], ["そ", "so", "そら", "天空"]], "sentence": "すしです。", "meaning": "是壽司。"}, {"day": 4, "title": "た行", "focus": "た・ち・つ・て・と", "items": [["た", "ta", "たまご", "蛋"], ["ち", "chi", "ちず", "地圖"], ["つ", "tsu", "つき", "月亮"], ["て", "te", "て", "手"], ["と", "to", "とけい", "時鐘"]], "sentence": "とけいです。", "meaning": "是時鐘。"}, {"day": 5, "title": "な行", "focus": "な・に・ぬ・ね・の", "items": [["な", "na", "なつ", "夏天"], ["に", "ni", "にく", "肉"], ["ぬ", "nu", "ぬの", "布"], ["ね", "ne", "ねこ", "貓"], ["の", "no", "のり", "海苔"]], "sentence": "ねこです。", "meaning": "是貓。"}, {"day": 6, "title": "は行", "focus": "は・ひ・ふ・へ・ほ", "items": [["は", "ha", "はな", "花"], ["ひ", "hi", "ひと", "人"], ["ふ", "fu", "ふね", "船"], ["へ", "he", "へや", "房間"], ["ほ", "ho", "ほん", "書"]], "sentence": "ほんです。", "meaning": "是書。"}, {"day": 7, "title": "ま行＋週複習", "focus": "ま・み・む・め・も", "items": [["ま", "ma", "まど", "窗戶"], ["み", "mi", "みず", "水"], ["む", "mu", "むし", "昆蟲"], ["め", "me", "め", "眼睛"], ["も", "mo", "もも", "桃子"]], "sentence": "みずです。", "meaning": "是水。"}, {"day": 8, "title": "や行", "focus": "や・ゆ・よ", "items": [["や", "ya", "やま", "山"], ["ゆ", "yu", "ゆき", "雪"], ["よ", "yo", "よる", "晚上"]], "sentence": "よるです。", "meaning": "是晚上。"}, {"day": 9, "title": "ら行", "focus": "ら・り・る・れ・ろ", "items": [["ら", "ra", "らいねん", "明年"], ["り", "ri", "りんご", "蘋果"], ["る", "ru", "るす", "不在家"], ["れ", "re", "れい", "例子"], ["ろ", "ro", "ろく", "六"]], "sentence": "りんごです。", "meaning": "是蘋果。"}, {"day": 10, "title": "わ行・ん", "focus": "わ・を・ん", "items": [["わ", "wa", "わたし", "我"], ["を", "o", "を", "助詞"], ["ん", "n", "ほん", "書"]], "sentence": "わたしです。", "meaning": "是我。"}, {"day": 11, "title": "濁音①", "focus": "が・ぎ・ぐ・げ・ご／ざ・じ・ず・ぜ・ぞ", "items": [["が", "ga", "がくせい", "學生"], ["ぎ", "gi", "ぎんこう", "銀行"], ["ぐ", "gu", "ぐあい", "狀況"], ["ざ", "za", "ざっし", "雜誌"], ["じ", "ji", "じかん", "時間"]], "sentence": "がくせいです。", "meaning": "是學生。"}, {"day": 12, "title": "濁音②・半濁音", "focus": "だ・ば・ぱ行", "items": [["だ", "da", "だれ", "誰"], ["で", "de", "でんわ", "電話"], ["ば", "ba", "ばん", "晚上"], ["び", "bi", "びょういん", "醫院"], ["ぱ", "pa", "パン", "麵包"]], "sentence": "だれですか。", "meaning": "是誰？"}, {"day": 13, "title": "拗音", "focus": "きゃ・きゅ・きょ 等", "items": [["きゃ", "kya", "きゃく", "客人"], ["きゅ", "kyu", "きゅう", "九"], ["きょ", "kyo", "きょう", "今天"], ["しゃ", "sha", "しゃしん", "照片"], ["ちょ", "cho", "ちょっと", "一下"]], "sentence": "きょうです。", "meaning": "是今天。"}, {"day": 14, "title": "促音・長音", "focus": "っ／ー", "items": [["っ", "pause", "きって", "郵票"], ["っ", "pause", "がっこう", "學校"], ["ー", "long", "コーヒー", "咖啡"]], "sentence": "がっこうへいきます。", "meaning": "去學校。"}, {"day": 15, "title": "平假名總複習", "focus": "46音＋濁音＋拗音", "items": [["あ", "a", "あした", "明天"], ["き", "ki", "きょう", "今天"], ["せ", "se", "せんせい", "老師"], ["ね", "ne", "ねこ", "貓"], ["わ", "wa", "わたし", "我"]], "sentence": "わたしはせんせいです。", "meaning": "我是老師。"}, {"day": 16, "title": "片假名①", "focus": "ア・イ・ウ・エ・オ／カ行", "items": [["ア", "a", "アイス", "冰淇淋"], ["イ", "i", "インク", "墨水"], ["ウ", "u", "ウール", "羊毛"], ["エ", "e", "エアコン", "冷氣"], ["オ", "o", "オレンジ", "橘子"]], "sentence": "アイスです。", "meaning": "是冰淇淋。"}, {"day": 17, "title": "片假名②", "focus": "サ行・タ行", "items": [["サ", "sa", "サラダ", "沙拉"], ["シ", "shi", "シーツ", "床單"], ["ス", "su", "スープ", "湯"], ["タ", "ta", "タクシー", "計程車"], ["ツ", "tsu", "ツアー", "旅行團"]], "sentence": "タクシーです。", "meaning": "是計程車。"}, {"day": 18, "title": "片假名③", "focus": "ナ行・ハ行", "items": [["ナ", "na", "ナイフ", "刀子"], ["ニ", "ni", "ニュース", "新聞"], ["ハ", "ha", "ハンバーガー", "漢堡"], ["ヒ", "hi", "ヒント", "提示"], ["フ", "fu", "フルーツ", "水果"]], "sentence": "ニュースです。", "meaning": "是新聞。"}, {"day": 19, "title": "片假名④", "focus": "マ行・ヤ行", "items": [["マ", "ma", "マスク", "口罩"], ["ミ", "mi", "ミルク", "牛奶"], ["ム", "mu", "ムード", "氣氛"], ["ヤ", "ya", "ヤード", "碼"], ["ユ", "yu", "ユーモア", "幽默"]], "sentence": "ミルクです。", "meaning": "是牛奶。"}, {"day": 20, "title": "片假名⑤", "focus": "ラ行・ワ・ン", "items": [["ラ", "ra", "ラジオ", "收音機"], ["リ", "ri", "リスト", "清單"], ["ル", "ru", "ルール", "規則"], ["ワ", "wa", "ワイン", "葡萄酒"], ["ン", "n", "パン", "麵包"]], "sentence": "ラジオです。", "meaning": "是收音機。"}, {"day": 21, "title": "片假名濁音", "focus": "ガ・ザ・ダ・バ・パ行", "items": [["ガ", "ga", "ガス", "瓦斯"], ["ジ", "ji", "ジム", "健身房"], ["バ", "ba", "バス", "公車"], ["ビ", "bi", "ビル", "大樓"], ["パ", "pa", "パン", "麵包"]], "sentence": "バスです。", "meaning": "是公車。"}, {"day": 22, "title": "片假名拗音・促音", "focus": "キャ・ッ・ー", "items": [["キャ", "kya", "キャベツ", "高麗菜"], ["シュ", "shu", "シューズ", "鞋子"], ["ッ", "pause", "ベッド", "床"], ["ー", "long", "スーパー", "超市"]], "sentence": "スーパーへいきます。", "meaning": "去超市。"}, {"day": 23, "title": "片假名總複習", "focus": "生活外來語", "items": [["コンビニ", "konbini", "コンビニ", "便利商店"], ["ホテル", "hoteru", "ホテル", "飯店"], ["テレビ", "terebi", "テレビ", "電視"], ["コーヒー", "koohii", "コーヒー", "咖啡"], ["タクシー", "takushii", "タクシー", "計程車"]], "sentence": "コンビニはここです。", "meaning": "便利商店在這裡。"}, {"day": 24, "title": "我是～", "focus": "わたし／あなた＋です", "items": [["わたし", "watashi", "わたし", "我"], ["あなた", "anata", "あなた", "你"], ["せんせい", "sensei", "せんせい", "老師"], ["がくせい", "gakusei", "がくせい", "學生"], ["かいしゃいん", "kaishain", "かいしゃいん", "公司職員"]], "sentence": "わたしは かいしゃいんです。", "meaning": "我是公司職員。"}, {"day": 25, "title": "肯定・否定", "focus": "～です／～ではありません", "items": [["です", "desu", "です", "是"], ["ではありません", "dewa arimasen", "ではありません", "不是"], ["にほんじん", "nihonjin", "にほんじん", "日本人"], ["がくせい", "gakusei", "がくせい", "學生"]], "sentence": "わたしは がくせいではありません。", "meaning": "我不是學生。"}, {"day": 26, "title": "疑問句", "focus": "～ですか", "items": [["ですか", "desu ka", "ですか", "是……嗎？"], ["はい", "hai", "はい", "是"], ["いいえ", "iie", "いいえ", "不是"], ["そうです", "sou desu", "そうです", "是的"]], "sentence": "あなたは せんせいですか。", "meaning": "你是老師嗎？"}, {"day": 27, "title": "這個・那個", "focus": "これ／それ／あれ", "items": [["これ", "kore", "これ", "這個"], ["それ", "sore", "それ", "那個（靠近對方）"], ["あれ", "are", "あれ", "那個（遠處）"], ["ほん", "hon", "ほん", "書"]], "sentence": "これは ほんです。", "meaning": "這是書。"}, {"day": 28, "title": "這裡・那裡", "focus": "ここ／そこ／あそこ", "items": [["ここ", "koko", "ここ", "這裡"], ["そこ", "soko", "そこ", "那裡"], ["あそこ", "asoko", "あそこ", "那邊"], ["トイレ", "toire", "トイレ", "廁所"]], "sentence": "トイレは あそこです。", "meaning": "廁所在那邊。"}, {"day": 29, "title": "の・も", "focus": "～的／也", "items": [["の", "no", "の", "的"], ["も", "mo", "も", "也"], ["わたしの", "watashi no", "わたしの", "我的"], ["ともだち", "tomodachi", "ともだち", "朋友"]], "sentence": "これは わたしの ほんです。", "meaning": "這是我的書。"}, {"day": 30, "title": "總複習・N5銜接", "focus": "五十音＋基礎句型", "items": [["おはよう", "ohayou", "おはよう", "早安"], ["こんにちは", "konnichiwa", "こんにちは", "你好"], ["ありがとう", "arigatou", "ありがとう", "謝謝"], ["すみません", "sumimasen", "すみません", "不好意思"], ["さようなら", "sayounara", "さようなら", "再見"]], "sentence": "わたしは にほんごを べんきょうします。", "meaning": "我學習日文。"}];
let currentDay = Number(localStorage.getItem('jp30-current') || 1);
let completed = JSON.parse(localStorage.getItem('jp30-completed') || '[]');

function save() {
  localStorage.setItem('jp30-current', String(currentDay));
  localStorage.setItem('jp30-completed', JSON.stringify(completed));
}
function updateProgress() {
  const n = completed.length;
  document.getElementById('progressText').textContent = `${n} / 30`;
  document.getElementById('progressBar').style.width = `${n/30*100}%`;
}
let speechToken = 0;
function speak(text, rate=0.9) {
  if (!('speechSynthesis' in window)) {
    alert('此瀏覽器不支援語音朗讀。請使用 iPad Safari。');
    return;
  }
  const myToken = ++speechToken;
  speechSynthesis.cancel();
  window.setTimeout(() => {
    if (myToken !== speechToken) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = rate;
    u.pitch = 1.0;
    u.volume = 1.0;
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  }, 320);
}
function speakSequence(parts, rate=0.9) {
  const text = parts.filter(Boolean).join('。') + '。';
  speak(text, rate);
}
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = DAYS.map(d => `
    <button class="daybtn ${d.day===currentDay?'active':''}" onclick="goDay(${d.day})">
      <span><div class="dtitle">Day ${d.day}｜${d.title}</div><div class="tiny">${d.focus}</div></span>
      <span class="check">${completed.includes(d.day)?'✓':''}</span>
    </button>`).join('');
  const sel = document.getElementById('daySelect');
  sel.innerHTML = DAYS.map(d => `<option value="${d.day}" ${d.day===currentDay?'selected':''}>Day ${d.day}｜${d.title}</option>`).join('');
  sel.onchange = e => goDay(Number(e.target.value));
}
function goDay(n) {
  currentDay = n; save(); renderSidebar(); renderDay();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleDone() {
  if (completed.includes(currentDay)) completed = completed.filter(x=>x!==currentDay);
  else completed.push(currentDay);
  completed.sort((a,b)=>a-b);
  save(); updateProgress(); renderSidebar(); renderDay();
}
function quizFor(day) {
  const d = DAYS[day-1];
  const item = d.items[Math.min(1,d.items.length-1)];
  const correct = item[3];
  let pool = DAYS.flatMap(x=>x.items.map(i=>i[3])).filter(x=>x!==correct);
  pool = [...new Set(pool)].sort(()=>Math.random()-.5).slice(0,3);
  const choices = [correct,...pool].sort(()=>Math.random()-.5);
  return {q:`「${item[2]}」是什麼意思？`, correct, choices};
}
function renderDay() {
  const d = DAYS[currentDay-1];
  const q = quizFor(currentDay);
  const isDone = completed.includes(currentDay);
  document.getElementById('panel').innerHTML = `
    <div class="topline">
      <div>
        <span class="badge">Day ${d.day}</span>
        <h2>${d.title}</h2>
        <div class="focus">今日重點：${d.focus}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="speak-all" onclick='speakSequence(${JSON.stringify([...d.items.map(i=>i[2]), d.sentence])},0.9)'>🔊 全部播放</button>
        <button class="done" onclick="toggleDone()">${isDone?'✓ 已完成':'標記完成'}</button>
      </div>
    </div>

    <div class="cards">
      ${d.items.map(i=>`
      <div class="kana-card">
        <div>
          <div class="kana">${i[0]}</div>
          <div class="romaji">${i[1]}</div>
          <div class="word">${i[2]}</div>
          <div class="meaning">${i[3]}</div>
        </div>
        <button class="speaker" onclick='speak(${JSON.stringify(i[2])})'>🔊 發音</button>
      </div>`).join('')}
    </div>

    <section class="example">
      <strong>今日例句</strong>
      <div class="jp">${d.sentence}</div>
      <div class="zh">${d.meaning}</div>
      <button class="speaker" onclick='speak(${JSON.stringify(d.sentence)},0.9)'>🔊 正常朗讀</button>
    </section>

    <div class="tip">
      <strong>30 分鐘建議：</strong>10 分鐘認讀今天的新字 → 10 分鐘跟著語音朗讀 3 次 → 10 分鐘遮住中文，自我測驗。
    </div>

    <section class="quiz">
      <strong>今日小測驗</strong>
      <div class="quizq">${q.q}</div>
      <div class="choices">
        ${q.choices.map(c=>`<button class="quizbtn" onclick='answer(this, ${JSON.stringify(c)}, ${JSON.stringify(q.correct)})'>${c}</button>`).join('')}
      </div>
      <div id="quizResult" class="footer-note"></div>
    </section>

    <div class="footer-note">
      語音使用 iPad / Safari 內建的日文 Text-to-Speech。若第一次沒有聲音，請確認 iPad 音量與 Safari 網頁語音權限；部分裝置需先在「設定 → 輔助使用 → 朗讀內容 → 聲音」下載日文語音。
    </div>
  `;
}
function answer(btn, val, correct) {
  document.querySelectorAll('.quizbtn').forEach(b=>b.disabled=true);
  if (val===correct) {
    btn.classList.add('correct');
    document.getElementById('quizResult').textContent='答對了！';
  } else {
    btn.classList.add('wrong');
    document.getElementById('quizResult').textContent='正確答案：'+correct;
    document.querySelectorAll('.quizbtn').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});
  }
}
speechSynthesis.onvoiceschanged = ()=>{};
renderSidebar(); renderDay(); updateProgress();
</script>
