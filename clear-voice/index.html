<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>30天日文自學｜清楚朗讀版</title><style>html,body{margin:0;width:100%;height:100%;background:#f7f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="../index.html" title="30天日文自學"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow;if(!w||!('speechSynthesis' in w))return;w.speakExample=function(text){w.speechSynthesis.cancel();const clean=String(text).replace(/\s+/g,'');setTimeout(()=>{const u=new w.SpeechSynthesisUtterance(clean);u.lang='ja-JP';u.rate=1.0;u.pitch=1;u.volume=1;w.speechSynthesis.resume();w.speechSynthesis.speak(u)},300)};});</script></body></html>
