<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Android 日文發音測試</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px;background:#f7f7fb;color:#111}.box{max-width:560px;margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px}button{width:100%;min-height:64px;font-size:20px;font-weight:700;border:0;border-radius:14px;background:#356ae6;color:white;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#status,#voices{margin-top:16px;padding:12px;border-radius:10px;background:#f1f3f5;line-height:1.6;white-space:pre-wrap}#voices{font-size:14px;color:#444}</style></head><body><div class="box"><h1>Android 日文發音測試</h1><p>這版會先載入 Chrome 可用的語音，再明確選擇日文 voice。</p><button id="testBtn" type="button">🔊 點我測試日文發音</button><div id="status">正在載入語音清單…</div><div id="voices">尚未取得語音清單</div></div><script>(function(){var btn=document.getElementById('testBtn');var status=document.getElementById('status');var voicesBox=document.getElementById('voices');var voices=[];function loadVoices(){if(!('speechSynthesis' in window)){status.textContent='此瀏覽器不支援 speechSynthesis';return;}voices=window.speechSynthesis.getVoices()||[];var ja=voices.filter(function(v){return /^ja([-_]|$)/i.test(v.lang)||/japanese|日本語/i.test(v.name);});voicesBox.textContent='Chrome 偵測到 '+voices.length+' 個語音\n日文 voice：'+(ja.length?ja.map(function(v){return v.name+' ['+v.lang+']';}).join('\n'):'沒有偵測到日文 voice');status.textContent=ja.length?'✓ 已載入日文 voice，可以測試':'⚠️ Chrome 尚未偵測到日文 voice';}loadVoices();if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=loadVoices;}btn.addEventListener('click',function(){status.textContent='✓ 按鈕已點擊，正在選擇日文 voice…';try{if(!('speechSynthesis' in window)){status.textContent='✓ 按鈕可點，但此瀏覽器不支援 speechSynthesis';return;}loadVoices();var ja=voices.find(function(v){return /^ja-JP$/i.test(v.lang);})||voices.find(function(v){return /^ja([-_]|$)/i.test(v.lang);})||voices.find(function(v){return /japanese|日本語/i.test(v.name);});window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance('こんにちは');u.lang='ja-JP';if(ja)u.voice=ja;u.rate=1;u.pitch=1;u.volume=1;u.onstart=function(){status.textContent='✓ 語音已啟動：'+(ja?(ja.name+' ['+ja.lang+']'):'未指定 voice，使用系統預設');};u.onend=function(){status.textContent='✓ 播放完成：'+(ja?(ja.name+' ['+ja.lang+']'):'系統預設 voice');};u.onerror=function(e){status.textContent='✓ 按鈕可點，但語音播放失敗：'+(e.error||'unknown');};window.speechSynthesis.resume();window.speechSynthesis.speak(u);}catch(e){status.textContent='✓ 按鈕可點，但程式錯誤：'+e.message;}});})();</script></body></html>
