<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Android 日文發音測試</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px;background:#f7f7fb;color:#111}.box{max-width:520px;margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px}button{width:100%;min-height:64px;font-size:20px;font-weight:700;border:0;border-radius:14px;background:#356ae6;color:white;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#status{margin-top:16px;padding:12px;border-radius:10px;background:#f1f3f5;line-height:1.6}</style></head><body><div class="box"><h1>Android 日文發音測試</h1><p>請點下面按鈕。只測試「こんにちは」。</p><button id="testBtn" type="button">🔊 點我測試發音</button><div id="status">尚未點擊</div></div><script>(function(){var btn=document.getElementById('testBtn');var status=document.getElementById('status');btn.addEventListener('click',function(){status.textContent='✓ 按鈕已點擊，正在嘗試播放…';try{if(!('speechSynthesis' in window)){status.textContent='✓ 按鈕可點，但此瀏覽器不支援 speechSynthesis';return;}window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance('こんにちは');u.lang='ja-JP';u.rate=1;u.pitch=1;u.volume=1;u.onstart=function(){status.textContent='✓ 按鈕與語音都已啟動';};u.onend=function(){status.textContent='✓ 播放完成';};u.onerror=function(e){status.textContent='✓ 按鈕可點，但語音播放失敗：'+(e.error||'unknown');};window.speechSynthesis.speak(u);}catch(e){status.textContent='✓ 按鈕可點，但程式錯誤：'+e.message;}});})();</script></body></html>
