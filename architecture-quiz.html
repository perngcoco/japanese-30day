<style>

.sections{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fbfdff}.check input{width:22px;height:22px}.modes{display:flex;gap:10px;flex-wrap:wrap}.radio{flex:1;min-width:220px;border:1px solid var(--line);border-radius:13px;padding:11px 12px;display:flex;align-items:center;gap:10px}.radio input{width:22px;height:22px}.primary,.secondary,.danger{border:0;border-radius:14px;min-height:52px;padding:12px 18px;font-weight:800}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 7px 18px rgba(20,93,160,.25)}.secondary{background:#edf5fb;color:#135282;border:1px solid #c8ddeb}.danger{background:#fff0f1;color:#9b1c2b;border:1px solid #f0c7cc}.full{width:100%}.statline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin-top:12px}.hidden{display:none!important}
.quizTop{position:sticky;top:0;z-index:5;background:rgba(243,247,251,.94);backdrop-filter:blur(10px);padding:8px 0 10px}.progressRow{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:15px;color:var(--muted)}.bar{height:8px;background:#dce7f1;border-radius:999px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#30a7df);transition:.25s}.qMeta{font-size:14px;color:#55708a;font-weight:800}.qTitle{font-size:clamp(21px,4.5vw,28px);line-height:1.5;margin:10px 0 16px}.visual{border:1px solid #d5dde6;border-radius:12px;background:#fff;padding:7px;margin:10px 0 16px;overflow:auto}.visual img{display:block;max-width:100%;height:auto;margin:auto}.choices{display:grid;gap:11px}.choice{width:100%;text-align:left;border:2px solid #d9e2ec;background:#fff;border-radius:15px;padding:14px 15px;min-height:58px;color:var(--ink);display:flex;align-items:flex-start;gap:12px}.choice .n{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef4f9;color:#305675;font-weight:800}.choice .txt{padding-top:2px}.choice.selected{border-color:#2382c4;background:#eef8ff}.choice.selected .n{background:#2382c4;color:#fff}.choice.correct{border-color:#46a474;background:#eefaf3}.choice.correct .n{background:#2c8c5b;color:#fff}.choice.wrong{border-color:#d86a74;background:#fff2f3}.choice.wrong .n{background:#c94a56;color:#fff}.feedback{margin-top:14px;border-radius:12px;padding:11px 13px;font-weight:700}.feedback.ok{background:#e9f8ef;color:#17653f}.feedback.bad{background:#fff0f1;color:#9d2632}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.nav .wide{grid-column:1/-1}.nav button:disabled{opacity:.45}.resultScore{text-align:center;padding:10px}.scoreNum{font-size:64px;line-height:1;font-weight:900;color:#0e5d99}.scoreSub{color:var(--muted);margin-top:8px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.met <body>
<div class="wrap">
  <header class="hero">
    <h1>丙級建築製圖應用｜完整學科題庫</h1>
    <p>專業科目＋四類共同科目；每次固定隨機抽 80 題，iPad／Safari 可直接作答。</p>
  </header>

  <section id="setup" class="card">
    <div class="grid">
      <div class="field">
        <label for="count">本次題數</label>
        <input id="count" type="number" inputmode="numeric" min="80" max="80" readonly value="80">
        <div class="quick">
          <button type="button" data-count="20">20 題</button><button type="button" data-count="40">40 題</button><button type="button" data-count="80">80 題</button><button type="button" data-count="100">100 題</button>
        </div>
        <div style="height:14px"></div>
        <div class="ratioBox">
          <div class="ratioTitle">固定出題比例</div>
          <div class="ratioGrid">
            <div class="ratioItem prof"><b>80%</b>專業科目</div>
            <div class="ratioItem"><b>5%</b>共同1 職安</div>
            <div class="ratioItem"><b>5%</b>共同2 倫理</div>
            <div class="ratioItem"><b>5%</b>共同3 環保</div>
            <div class="ratioItem"><b>5%</b>共同4 節能</div>
          </div>
          <div id="allocationPreview" class="ratioNote"></div>
          <div id="roundWarn" class="warning hidden">題數不是 20 的倍數時，各共同科目因整數題數限制可能相差 1 題，系統會採最接近 80%／5%／5%／5%／5% 的配置。</div>
        </div>
      </div>
      <div>
        <div class="label">專業科目出題範圍</div>
        <div id="sectionChecks" class="sections"></div>
        <div class="footnote">共同科目 1～4 固定各占 5%，不受上方專業工作項目勾選影響。</div>
      </div>
    </div>
    <div style="height:16px"></div>
    <div class="label">作答模式</div>
    <div class="modes">
      <label class="radio"><input type="radio" name="mode" value="practice" checked><span><b>練習模式</b><br><small>每題作答後立即顯示正解</small></span></label>
      <label class="radio"><input type="radio" name="mode" value="exam"><span><b>測驗模式</b><br><small>全部作答後再交卷看成績</small></span></label>
    </div>
    <div style="height:16px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button id="startBtn" class="primary">開始 80 題隨機抽題</button><button id="refreshBankBtn" class="secondary">刷新題庫／重新抽 80 題</button></div>
    <div id="bankStat" class="statline"></div>
    <div class="footnote">PDF 中標示「本題刪題」者已自動排除。題目與正解依提供之題庫 PDF。</div>
  </section>

  <section id="quiz" class="hidden">
    <div class="quizTop">
      <div class="progressRow"><span id="progressText"></span><span id="answeredText"></span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div class="card">
      <div id="qMeta" class="qMeta"></div>
      <div id="qTitle" class="qTitle"></div>
      <div id="visuals"></div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="nav">
        <button id="prevBtn" class="secondary">上一題</button>
        <button id="nextBtn" class="primary">下一題</button>
        <button id="submitBtn" class="danger wide hidden">交卷並計分</button>
      </div>
    </div>
  </section>

  <section id="result" class="card hidden">
    <div class="resultScore">
      <div id="scoreNum" class="scoreNum">0</div>
      <div class="scoreSub">本次成績</div>
    </div>
    <div id="resultMix" class="resultMix"></div>
    <div class="metrics">
      <div class="metric"><b id="correctN">0</b><span>答對</span></div>
      <div class="metric"><b id="wrongN">0</b><span>答錯</span></div>
      <div class="metric"><b id="blankN">0</b><span>未答</span></div>
    </div>
    <div class="nav">
      <button id="reviewBtn" class="secondary">查看錯題</button>
      
      <button id="backBtn" class="secondary wide">回到模式設定</button>
    </div>
    <div id="reviewList" class="hidden" style="margin-top:18px"></div>
  </section>
</div>

tionName":"工作倫理與職業道德","number":10,"stem":"有關智慧財產權行為之敘述，下列何者有誤？","options":["製造、販售仿冒註冊商標 的商品雖已侵害商標權，但不屬於公訴罪之範疇","以101 大樓、美麗華百 貨公司做為拍攝電影的背景，屬於合理使用的範圍","原作者自行創作某音 樂作品後，即可宣稱擁有該作品之著作權","著作權是為促進文化發展為目 的，所保護的財產權之一"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-011","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":11,"stem":"專利權又可區分為發明、新型與設計三種專利權，其中發明專利權是否有 保護期限？期限為何？","options":["有，5 年","有，20 年","有，50 年","無期限， 只要申請後就永久歸申請人所有"],"answer":2,"deleted":false,"visuals":[]},{"id":"C2-01-012","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":12,"stem":"受僱人於職務上所完成之著作，如果沒有特別以契約約定，其著作人為下 列何者？","options":["雇用人","受僱人","雇用公司或機關法人代表","由雇用人指定 之自然人或法人"],"answer":2,"deleted":false,"visuals":[]},{"id":"C2-01-013","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":13,"stem":"任職於某公司的程式設計工程師，因職務所編寫之電腦程式，如果沒有特 別以契約約定，則該電腦程式之著作財產權歸屬下列何者？","options":["公司","編 寫程式之工程師","公司全體股東共有","公司與編寫程式之工程師共有"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-014","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":14,"stem":"某公司員工因執行業務，擅自以重製之方法侵害他人之著作財產權，若被 害人提起告訴，下列對於處罰對象的敘述，何者正確？","options":["僅處罰侵犯他人 著作財產權之員工","僅處罰雇用該名員工的公司","該名員工及其雇主皆 須受罰","員工只要在從事侵犯他人著作財產權之行為前請示雇主並獲同 意，便可以不受處罰"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-015","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":15,"stem":"受僱人於職務上所完成之發明、新型或設計，其專利申請權及專利權如未 特別約定屬於下列何者？","options":["雇用人","受僱人","雇用人所指定之自然人或 法人","雇用人與受僱人共有"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-016","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":16,"stem":"任職大發公司的郝聰明，專門從事技術研發，有關研發技術的專利申請權 及專利權歸屬，下列敘述何者錯誤？","options":["職務上所完成的發明，除契約另有 約定外，專利申請權及專利權屬於大發公司","職務上所完成的發明，雖然 專利申請權及專利權屬於大發公司，但是郝聰明享有姓名表示權","郝聰明 完成非職務上的發明，應即以書面通知大發公司","大發公司與郝聰明之雇 傭契約約定，郝聰明非職務上的發明，全部屬於公司，約定有效"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-017","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":17,"stem":"有關著作權的敘述，下列何者錯誤？","options":["我們到表演場所觀看表演時，不可 隨便錄音或錄影","到攝影展上，拿相機拍攝展示的作品，分贈給朋友，是 侵害著作權的行為","網路上供人下載的免費軟體，都不受著作權法保護， 所以我可以燒成大補帖光碟，再去賣給別人","高普考試題，不受著作權法 保護"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-018","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":18,"stem":"有關著作權的敘述，下列何者錯誤？","options":["撰寫碩博士論文時，在合理範圍內 引用他人的著作，只要註明出處，不會構成侵害著作權","在網路散布盜版 光碟，不管有沒有營利，會構成侵害著作權","在網路的部落格看到一篇文 章很棒，只要註明出處，就可以把文章複製在自己的部落格","將補習班老 師的上課內容錄音檔，放到網路上拍賣，會構成侵害著作權"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-019","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":19,"stem":"有關商標權的敘述，下列何者錯誤？","options":["要取得商標權一定要申請商標註冊","商標註冊後可取得10 年商標權","商標註冊後，3 年不使用，會被廢止 商標權","在夜市買的仿冒品，品質不好，上網拍賣，不會構成侵權"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-020","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":20,"stem":"有關營業秘密的敘述，下列何者錯誤？","options":["受雇人於非職務上研究或開發之 營業秘密，仍歸雇用人所有","營業秘密不得為質權及強制執行之標的","營業秘密所有人得授權他人使用其營業秘密","營業秘密得全部或部分讓與 他人或與他人共有"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-021","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":21,"stem":"甲公司將其新開發受營業秘密法保護之技術，授權乙公司使用，下列何者 錯誤？","options":["乙公司已獲授權，所以可以未經甲公司同意，再授權丙公司使用","約定授權使用限於一定之地域、時間","約定授權使用限於特定之內容、 一定之使用方法","要求被授權人乙公司在一定期間負有保密義務"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-022","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":22,"stem":"甲公司嚴格保密之最新配方產品大賣，下列何者侵害甲公司之營業秘密？","opti 被發 現有親友關係便可"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-036","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":36,"stem":"小美是公司的業務經理，有一天巧遇國中同班的死黨小林，發現他是公司 的下游廠商老闆。最近小美處理一件公司的招標案件，小林的公司也在其 中，私下約小美見面，請求她提供這次招標案的底標，並馬上要給予幾十 萬元的前謝金，請問小美該怎麼辦？","options":["退回錢，並告訴小林都是老朋友， 一定會全力幫忙","收下錢，將錢拿出來給單位同事們分紅","應該堅決拒 絕，並避免每次見面都與小林談論相關業務問題","朋友一場，給他一個比 較接近底標的金額，反正又不是正確的，所以沒關係"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-037","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":37,"stem":"公司發給每人一台平板電腦提供業務上使用，但是發現根本很少在使用， 為了讓它有效的利用，所以將它拿回家給親人使用，這樣的行為是","options":["可以 的，這樣就不用花錢買","可以的，反正放在那裡不用它，也是浪費資源","不可以的，因為這是公司的財產，不能私用","不可以的，因為使用年限 未到，如果年限到報廢了，便可以拿回家"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-038","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":38,"stem":"公司的車子，假日又沒人使用，你是鑰匙保管者，請問假日可以開出去 嗎？","options":["可以，只要付費加油即可","可以，反正假日不影響公務","不可 以，因為是公司的，並非私人擁有","不可以，應該是讓公司想要使用的員 工，輪流使用才可"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-039","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":39,"stem":"阿哲是財經線的新聞記者，某次採訪中得知A 公司在一個月內將有一個大 的併購案，這個併購案顯示公司的財力，且能讓A 公司股價往上飆升。請 問阿哲得知此消息後，可以立刻購買該公司的股票嗎？","options":["可以，有錢大家 賺","可以，這是我努力獲得的消息","可以，不賺白不賺","不可以，屬於 內線消息，必須保持記者之操守，不得洩漏"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-040","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":40,"stem":"與公務機關接洽業務時，下列敘述何者正確？","options":["沒有要求公務員違背職 務，花錢疏通而已，並不違法","唆使公務機關承辦採購人員配合浮報價 額，僅屬偽造文書行為","口頭允諾行賄金額但還沒送錢，尚不構成犯罪","與公務員同謀之共犯，即便不具公務員身分，仍可依據貪污治罪條例處 刑"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-041","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":41,"stem":"與公務機關有業務往來構成職務利害關係者，下列敘述何者正確？","options":["將餽 贈之財物請公務員父母代轉，該公務員亦已違反規定","與公務機關承辦人 飲宴應酬為增進基本關係的必要方法","高級茶葉低價售予有利害關係之承 辦公務員，有價購行為就不算違反法規","機關公務員藉子女婚宴廣邀業務 往來廠商之行為，並無不妥"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-042","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":42,"stem":"廠商某甲承攬公共工程，工程進行期間，甲與其工程人員經常招待該公共 工程委辦機關之監工及驗收之公務員喝花酒或招待出國旅遊，下列敘述何 者正確？","options":["公務員若沒有收現金，就沒有罪","只要工程沒有問題，某甲 與監工及驗收等相關公務員就沒有犯罪","因為不是送錢，所以都沒有犯罪","某甲與相關公務員均已涉嫌觸犯貪污治罪條例"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-043","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":43,"stem":"行（受）賄罪成立要素之一為具有對價關係，而作為公務員職務之對價有 「賄賂」或「不正利益」，下列何者不屬於「賄賂」或「不正利益」？","options":["開工邀請公務員觀禮","送百貨公司大額禮券","免除債務","招待吃米其林 等級之高檔大餐"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-044","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":44,"stem":"下列有關貪腐的敘述何者錯誤？","options":["貪腐會危害永續發展和法治","貪腐會 破壞民主體制及價值觀","貪腐會破壞倫理道德與正義","貪腐有助降低企 業的經營成本"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-045","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":45,"stem":"下列何者不是設置反貪腐專責機構須具備的必要條件？","options":["賦予該機構必要 的獨立性","使該機構的工作人員行使職權不會受到不當干預","提供該機 構必要的資源、專職工作人員及必要培訓","賦予該機構的工作人員有權力 可隨時逮捕貪污嫌疑人"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-046","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":46,"stem":"檢舉人向有偵查權機關或政風機構檢舉貪污瀆職，必須於何時為之始可能 給與獎金？","options":["犯罪未起訴前","犯罪未發覺前","犯罪未遂前","預備犯罪 前"],"answer":2,"deleted":false,"visuals":[]},{"id":"C2-01-047","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":47,"stem":"檢舉人應以何種方式檢舉貪污瀆職始能核給獎金？","options":["匿名","委託他人檢 舉","以真實姓名檢舉","以他人名義檢舉"],"answer":3,"deleted":false,"visuals":[]},{"id" "visuals":[]},{"id":"C2-01-055","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":55,"stem":"從事專業性工作，在與客戶約定時間應","options":["保持彈性，任意調整","儘可能 準時，依約定時間完成工作","能拖就拖，能改就改","自己方便就好，不 必理會客戶的要求"],"answer":2,"deleted":false,"visuals":[]},{"id":"C2-01-056","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":56,"stem":"從事專業性工作，在服務顧客時應有的態度為何？","options":["選擇最安全、經濟及 有效的方法完成工作","選擇工時較長、獲利較多的方法服務客戶","為了 降低成本，可以降低安全標準","不必顧及雇主和顧客的立場"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-057","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":57,"stem":"以下哪一項員工的作為符合敬業精神？","options":["利用正常工作時間從事私人事務","運用雇主的資源，從事個人工作","未經雇主同意擅離工作崗位","謹守 職場紀律及禮節，尊重客戶隱私"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-058","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":58,"stem":"小張獲選為小孩學校的家長會長，這個月要召開會議，沒時間準備資料， 所以，利用上班期間有空檔非休息時間來完成，請問是否可以？","options":["可以， 因為不耽誤他的工作","可以，因為他能力好，能夠同時完成很多事","不 可以，因為這是私事，不可以利用上班時間完成","可以，只要不要被發 現"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-059","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":59,"stem":"小吳是公司的專用司機，為了能夠隨時用車，經過公司同意，每晚都將公 司的車開回家，然而，他發現反正每天上班路線，都要經過女兒學校，就 順便載女兒上學，請問可以嗎？","options":["可以，反正順路","不可以，這是公司 的車不能私用","可以，只要不被公司發現即可","可以，要資源須有效使 用"],"answer":2,"deleted":false,"visuals":[]},{"id":"C2-01-060","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":60,"stem":"小江是職場上的新鮮人，剛進公司不久，他應該具備怎樣的態度？","options":["上 班、下班，管好自己便可","仔細觀察公司生態，加入某些小團體，以做為 後盾","只要做好人脈關係，這樣以後就好辦事","努力做好自己職掌的業 務，樂於工作，與同事之間有良好的互動，相互協助"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-061","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":61,"stem":"在公司內部行使商務禮儀的過程，主要以參與者在公司中的何種條件來訂 定順序？","options":["年齡","性別","社會地位","職位"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-062","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":62,"stem":"一位職場新鮮人剛進公司時，良好的工作態度是","options":["多觀察、多學習，了解 企業文化和價值觀","多打聽哪一個部門比較輕鬆，升遷機會較多","多探 聽哪一個公司在找人，隨時準備跳槽走人","多遊走各部門認識同事，建立 自己的小圈圈"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-063","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":63,"stem":"根據消除對婦女一切形式歧視公約(CEDAW)，下列何者正確？","options":["對婦女 的歧視指基於性別而作的任何區別、排斥或限制","只關心女性在政治方面 的人權和基本自由","未要求政府需消除個人或企業對女性的歧視","傳統 習俗應予保護及傳承，即使含有歧視女性的部分，也不可以改變"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-064","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":64,"stem":"某規範明定地政機關進用女性測量助理名額，不得超過該機關測量助理名 額總數二分之一，根據消除對婦女一切形式歧視公約(CEDAW)，下列何者 正確？","options":["限制女性測量助理人數比例，屬於直接歧視","土地測量經常在 戶外工作，基於保護女性所作的限制，不屬性別歧視","此項二分之一規定 是為促進男女比例平衡","此限制是為確保機關業務順暢推動，並未歧視女 性"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-065","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":65,"stem":"根據消除對婦女一切形式歧視公約(CEDAW)之間接歧視意涵，下列何者錯 誤？","options":["一項法律、政策、方案或措施表面上對男性和女性無任何歧視，但 實際上卻產生歧視女性的效果","察覺間接歧視的一個方法，是善加利用性 別統計與性別分析","如果未正視歧視之結構和歷史模式，及忽略男女權力 關係之不平等，可能使現有不平等狀況更為惡化","不論在任何情況下，只 要以相同方式對待男性和女性，就能避免間接歧視之產生"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-066","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":66,"stem":"下列何者不是菸害防制法之立法目的？","options":["防制菸害","保護未成年免於菸 害","保護孕婦免於菸害","促進菸品的使用"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-067","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":67,"stem":"按菸害防制法規定，在禁菸場所吸菸會被罰多少錢？","op :"C2-01-074","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":74,"stem":"營業秘密可分為「技術機密」與「商業機密」，下列何者屬於「商業機 密」？","options":["程式","設計圖","商業策略","生產製程"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-075","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":75,"stem":"某甲在公務機關擔任首長，其弟弟乙是某協會的理事長，乙為舉辦協會活 動，決定向甲服務的機關申請經費補助，下列有關利益衝突迴避之敘述， 何者正確？","options":["協會是舉辦慈善活動，甲認為是好事，所以指示機關承辦人 補助活動經費","機關未經公開公平方式，私下直接對協會補助活動經費新 臺幣10 萬元","甲應自行迴避該案審查，避免瓜田李下，防止利益衝突","乙為順利取得補助，應該隱瞞是機關首長甲之弟弟的身分"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-076","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":76,"stem":"依公職人員利益衝突迴避法規定，公職人員甲與其小舅子乙（二親等以內 的關係人）間，下列何種行為不違反該法？","options":["甲要求受其監督之機關聘用 小舅子乙","小舅子乙以請託關說之方式，請求甲之服務機關通過其名下農 地變更使用申請案","關係人乙經政府採購法公開招標程序，並主動在投標 文件表明與甲的身分關係，取得甲服務機關之年度採購標案","甲、乙兩人 均自認為人公正，處事坦蕩，任何往來都是清者自清，不需擔心任何問 題"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-077","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":77,"stem":"大雄擔任公司部門主管，代表公司向公務機關投標，為使公司順利取得標 案，可以向公務機關的採購人員為以下何種行為？","options":["為社交禮俗需要，贈 送價值昂貴的名牌手錶作為見面禮","為與公務機關間有良好互動，招待至 有女陪侍場所飲宴","為了解招標文件內容，提出招標文件疑義並請說明","為避免報價錯誤，要求提供底價作為參考"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-078","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":78,"stem":"下列關於政府採購人員之敘述，何者未違反相關規定？","options":["非主動向廠商求 取，是偶發地收到廠商致贈價值在新臺幣500 元以下之廣告物、促銷品、 紀念品","要求廠商提供與採購無關之額外服務","利用職務關係向廠商借 貸","利用職務關係媒介親友至廠商處所任職"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-079","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":79,"stem":"下列敘述何者錯誤？","options":["憲法保障言論自由，但散布假新聞、假消息仍須面 對法律責任","在網路或Line 社群網站收到假訊息，可以敘明案情並附加 截圖檔，向法務部調查局檢舉","對新聞媒體報導有意見，向國家通訊傳播 委員會申訴","自己或他人捏造、扭曲、竄改或虛構的訊息，只要一小部分 能證明是真的，就不會構成假訊息"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-080","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":80,"stem":"下列敘述何者正確？","options":["公務機關委託的代檢（代驗）業者，不是公務員， 不會觸犯到刑法的罪責","賄賂或不正利益，只限於法定貨幣，給予網路遊 戲幣沒有違法的問題","在靠北公務員社群網站，覺得可受公評且匿名發 文，就可以謾罵公務機關對特定案件的檢查情形","受公務機關委託辦理案 件，除履行採購契約應辦事項外，對於蒐集到的個人資料，也要遵守相關 保護及保密規定"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-081","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":81,"stem":"有關促進參與及預防貪腐的敘述，下列何者錯誤？","options":["我國非聯合國會員 國，無須落實聯合國反貪腐公約規定","推動政府部門以外之個人及團體積 極參與預防和打擊貪腐","提高決策過程之透明度，並促進公眾在決策過程 中發揮作用","對公職人員訂定執行公務之行為守則或標準"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-082","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":82,"stem":"為建立良好之公司治理制度，公司內部宜納入何種檢舉人制度？","options":["告訴乃 論制度","吹哨者（whistleblower）保護程序及保護制度","不告不理制度","非告訴乃論制度"],"answer":2,"deleted":false,"visuals":[]},{"id":"C2-01-083","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":83,"stem":"有關公司訂定誠信經營守則時，下列何者錯誤？","options":["避免與涉有不誠信行為 者進行交易","防範侵害營業秘密、商標權、專利權、著作權及其他智慧財 產權","建立有效之會計制度及內部控制制度","防範檢舉"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-084","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":84,"stem":"乘坐轎車時，如有司機駕駛，按照國際乘車禮儀，以司機的方位來看，首 位應為","options":["後排右側","前座右側","後排左側","後排中間"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-085","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":85,"stem":"今天好友突然來電，想來個「說走就走的旅行」，因此，無法去上班，下 列何者作法不適當？","options":["發送E-MAIL 給主管與人事部門，並收到回覆","什麼都無需做，等公司打電話來確認後，再告知即可","用LINE 傳訊息給 主管，並確認讀取且有回覆","打電話給主管與人事部門請假"],"answer":2,"deleted":false,"visuals":[]},{"id":"C2-01-086","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":86,"stem":"每天下班回家後，就懶得再出門去買菜，利用上班時間瀏覽線上購物網 站，發現有很多限時搶購的便宜商品，還能在下班前就可以送到公司，下 班順便帶回家，省掉好多時間，下列何者最適當？","options":["可以，又沒離開工作 崗位，且能節省時間","可以，還能介紹同事一同團購，省更多的錢，增進 同事情誼","不可以，應該把商品寄回家，不是公司","不可以，上班不能 從事個人私務，應該等下班後再網路購物"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-087","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":87,"stem":"宜樺家中養了一隻貓，由於最近生病，獸醫師建議要有人一直陪牠，這樣 會恢復快一點，辦公室雖然禁止攜帶寵物，但因為上班家裡無人陪伴，所 以準備帶牠到辦公室一起上班，下列何者最適當？","options":["可以，只要我放在寵 物箱，不要影響工作即可","可以，同事們都答應也不反對","可以，雖然 貓會發出聲音，大小便有異味，只要處理好不影響工作即可","不可以，可 以送至專門機構照護或請專人照顧，以免影響工作"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-088","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":88,"stem":"根據性別平等工作法，下列何者非屬職場性騷擾？","options":["公司員工執行職務 時，客戶對其講黃色笑話，該員工感覺被冒犯","雇主對求職者要求交往， 作為僱用與否之交換條件","公司員工執行職務時，遭到同事以「女人就是 沒大腦」性別歧視用語加以辱罵，該員工感覺其人格尊嚴受損","公司員工 下班後搭乘捷運，在捷運上遭到其他乘客偷拍"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-089","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":89,"stem":"根據性別平等工作法，下列何者非屬職場性別歧視？","options":["雇主考量男性賺錢 養家之社會期待，提供男性高於女性之薪資","雇主考量女性以家庭為重之 社會期待，裁員時優先資遣女性","雇主事先與員工約定倘其有懷孕之情 事，必須離職","有未滿2 歲子女之男性員工，也可申請每日六十分鐘的哺 乳時間"],"answer":4,"deleted":false,"visuals":[]},{"id":"C2-01-090","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":90,"stem":"根據性別平等工作法，有關雇主防治性騷擾之責任與罰則，下列何者錯 誤？","options":["僱用受僱者30 人以上者，應訂定性騷擾防治措施、申訴及懲戒規 範","雇主知悉性騷擾發生時，應採取立即有效之糾正及補救措施","雇主 違反應訂定性騷擾防治措施之規定時，處以罰鍰即可，不用公布其姓名","雇主違反應訂定性騷擾申訴管道者，應限期令其改善，屆期未改善者，應 按次處罰"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-091","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":91,"stem":"根據性騷擾防治法，有關性騷擾之責任與罰則，下列何者錯誤？","options":["對他人 為性騷擾者，如果沒有造成他人財產上之損失，就無需負擔金錢賠償之責 任","對於因教育、訓練、醫療、公務、業務、求職，受自己監督、照護之 人，利用權勢或機會為性騷擾者，得加重科處罰鍰至二分之一","意圖性騷 擾，乘人不及抗拒而為親吻、擁抱或觸摸其臀部、胸部或其他身體隱私處 之行為者，處2 年以下有期徒刑、拘役或併科10 萬元以下罰金","對他人 為權勢性騷擾以外之性騷擾者，由直轄市、縣（市）主管機關處1 萬元以 上10 萬元以下罰鍰"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-092","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":92,"stem":"根據性別平等工作法規範職場性騷擾範疇，下列何者錯誤？","options":["上班執行職 務時，任何人以性要求、具有性意味或性別歧視之言詞或行為，造成敵意 性、脅迫性或冒犯性之工作環境","對僱用、求職或執行職務關係受自己指 揮、監督之人，利用權勢或機會為性騷擾","與朋友聚餐後回家時，被陌生 人以盯梢、守候、尾隨跟蹤","雇主對受僱者或求職者為明示或暗示之性要 求、具有性意味或性別歧視之言詞或行為"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-093","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":93,"stem":"根據消除對婦女一切形式歧視公約（CEDAW）之直接歧視及間接歧視意 涵，下列何者錯誤？","options":["老闆得知小黃懷孕後，故意將小黃調任薪資待遇較 差的工作，意圖使其自行離開職場，小黃老闆的行為是直接歧視","某餐廳 於網路上招募外場服務生，條件以未婚年輕女性優先錄取，明顯以性或性 別差異為由所實施的差別待遇，為直接歧視","某公司員工值班注意事項排 除女性員工參與夜間輪值，是考量女性有人身安全及家庭照顧等需求，為 維護女性權益之措施，非直接歧視","某科技公司規定男女員工之加班時數 上限及加班費或津貼不同，認為女性能力有限，且無法長時間工作，限制 女性獲取薪資及升遷機會，這規定是直接歧視"],"answer":3,"deleted":false,"visuals":[]},{"id":"C2-01-094","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":94,"stem":"目前菸害防制法規範，「不可販賣菸品」給未滿幾歲的人？","options":["20","19","18","17"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-095","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":95,"stem":"按菸害防制法規定，下列敘述何者錯誤？","options":["只有老闆、店員才可以出面勸 阻在禁菸場所抽菸的人","任何人都可以出面勸阻在禁菸場所抽菸的人","餐廳、旅館設置室內吸菸室，需經專業技師簽證核可","加油站屬易燃易爆 場所，任何人都可以勸阻在禁菸場所抽菸的人"],"answer":1,"deleted":false,"visuals":[]},{"id":"C2-01-096","group":"common2","groupName":"共同科目2｜工作倫理與職業道德","sourceCode":"90007","section":1,"sectionName":"工作倫理與職業道德","number":96,"stem":"關於菸品對人體危害的敘述，下列何者正確？","options":["只要開電風扇、或是抽風 機就可以去除菸霧中的有害物質","指定菸品（如：加熱菸）只要通過健康 風險評估，就不會危害健康 者並無一定的保障","省水標章能激勵廠 商重視省水產品的研發與製造，進而達到推廣節水良性循環之目的","省水 標章除有用水設備外，亦可使用於冷氣或冰箱上"],"answer":3,"deleted":false,"visuals":[]},{"id":"C4-04-074","group":"common4","groupName":"共同科目4｜節能減碳","sourceCode":"90009","section":4,"sectionName":"節能減碳","number":74,"stem":"透過淋浴習慣的改變就可以節約用水，下列何者正確？","options":["淋浴時抹肥皂， 無需將蓮蓬頭暫時關上","等待熱水前流出的冷水可以用水桶接起來再利用","淋浴流下的水不可以刷洗浴室地板","淋浴沖澡流下的水，可以儲蓄洗菜 使用"],"answer":2,"deleted":false,"visuals":[]},{"id":"C4-04-075","group":"common4","groupName":"共同科目4｜節能減碳","sourceCode":"90009","section":4,"sectionName":"節能減碳","number":75,"stem":"家人洗澡時，一個接一個連續洗，也是一種有效的省水方式嗎？","options":["是，因 為可以節省等待熱水流出之前所先流失的冷水","否，這跟省水沒什麼關 係，不用這麼麻煩","否，因為等熱水時流出的水量不多","有可能省水也 可能不省水，無法定論"],"answer":1,"deleted":false,"visuals":[]},{"id":"C4-04-076","group":"common4","groupName":"共同科目4｜節能減碳","sourceCode":"90009","section":4,"sectionName":"節能減碳","number":76,"stem":"下列何種方式有助於節省洗衣機的用水量？","options":["洗衣機洗滌的衣物盡量裝 滿，一次洗完","購買洗衣機時選購有省水標章的洗衣機，可有效節約用水","無需將衣物適當分類","洗濯衣物時盡量選擇高水位才洗得乾淨"],"answer":2,"deleted":false,"visuals":[]},{"id":"C4-04-077","group":"common4","groupName":"共同科目4｜節能減碳","sourceCode":"90009","section":4,"sectionName":"節能減碳","number":77,"stem":"如果水龍頭流量過大，下列何種處理方式錯誤？","options":["加裝節水墊片或起波器","加裝可自動關閉水龍頭的自動感應器","直接換裝沒有省水標章的水龍頭","直接調整水龍頭到適當水量"],"answer":3,"deleted":false,"visuals":[]},{"id":"C4-04-078","group":"common4","groupName":"共同科目4｜節能減碳","sourceCode":"90009","section":4,"sectionName":"節能減碳","number":78,"stem":"洗菜水、洗碗水、洗衣水、洗澡水等的清洗水，不可直接利用來做什麼用 途？","options":["洗地板","沖馬桶","澆花","飲用水"],"answer":4,"deleted":false,"visuals":[]},{"id":"C4-04-079","group":"common4","groupName":"共同科目4｜節能減碳","sourceCode":"90009","section":4,"sectionName":"節能減碳","number":79,"stem":"如果馬桶有不正常的漏水問題，下列何者處理方式錯誤？","options":["因為馬桶還能 正常使用，所以不用著急，等到不能用時再報修即可","立刻檢查馬桶水箱 零件有無鬆脫，並確認有無漏水","滴幾滴食用色素到水箱裡，檢查有無有 色水流進馬桶，代表可能有漏水","通知水電行或檢修人員來檢修，徹底根 絕漏水問題"],"answer":1,"deleted":false,"visuals":[]},{"id":"C4-04-080","group":"common4","groupName":"共同科目4｜節能減碳","sourceCode":"90009","section":4,"sectionName":"節能減碳","number":80,"s <script>
const BANK=JSON.parse(document.getElementById('bank').textContent);
const usable=BANK.filter(q=>!q.deleted);
const circ=['①','②','③','④'];
const WEIGHTS={professional:.80,common1:.05,common2:.05,common3:.05,common4:.05};
const GROUP_LABEL={professional:'專業',common1:'職安',common2:'倫理',common3:'環保',common4:'節能'};
const GROUP_ORDER=['professional','common1','common2','common3','common4'];
const $=id=>document.getElementById(id);
let session=[],answers={},current=0,mode='practice',lastConfig=null,locked={},lastAllocation=null;

function professionalSectionInfo(){
  const m=new Map(); usable.filter(q=>q.group==='professional').forEach(q=>m.set(q.section,{name:q.sectionName,count:(m.get(q.section)?.count||0)+1}));
  return [...m.entries()].sort((a,b)=>a[0]-b[0]);
}
function groupCount(g){return usable.filter(q=>q.group===g).length}
function init(){
  const info=professionalSectionInfo();
  $('sectionChecks').innerHTML=info.map(([id,v])=>`<label class="check"><input type="checkbox" class="sec" value="${id}" checked><span>工作項目 ${String(id).padStart(2,'0')}：${escapeHtml(v.name)} <small>(${v.count}題)</small></span></label>`).join('');
  const p=groupCount('professional'), c1=groupCount('common1'),c2=groupCount('common2'),c3=groupCount('common3'),c4=groupCount('common4');
  $('bankStat').innerHTML=`<span>可抽題總數：<b>${usable.length}</b> 題</span><span>專業 ${p}｜職安 ${c1}｜倫理 ${c2}｜環保 ${c3}｜節能 ${c4}</span>`;
  document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{$('count').value=b.dataset.count;updatePreview()});
  $('count').addEventListener('input',updatePreview);document.querySelectorAll('.sec').forEach(x=>x.addEventListener('change',updatePreview));
  $('startBtn').onclick=()=>startQuiz(); $('prevBtn').onclick=()=>move(-1); $('nextBtn').onclick=()=>move(1); $('submitBtn').onclick=finish;
  $('refreshBankBtn').onclick=()=>startQuiz(lastConfig||{secs:selectedSections(),count:80,mode:document.querySelector('input[name=mode]:checked').value}); $('backBtn').onclick=showSetup; $('reviewBtn').onclick=toggleReview;updatePreview();
}
function selectedSections(){return [...document.querySelectorAll('.sec:checked')].map(x=>+x.value)}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function allocate(n){
  n=Math.max(1,Math.floor(n));
  const raw=GROUP_ORDER.map((g,i)=>({g,i,raw:n*WEIGHTS[g],base:Math.floor(n*WEIGHTS[g])}));
  let used=raw.reduce((s,x)=>s+x.base,0),left=n-used;
  raw.sort((a,b)=>((b.raw-b.base)-(a.raw-a.base)) || (a.i-b.i));
  for(let i=0;i<left;i++)raw[i%raw.length].base++;
  raw.sort((a,b)=>a.i-b.i); return Object.fromEntries(raw.map(x=>[x.g,x.base]));
}
function selectedProPool(secs){return usable.filter(q=>q.group==='professional'&&secs.includes(q.section))}
function previewText(a){return `本次實際配題：專業 ${a.professional} 題｜職安 ${a.common1}｜倫理 ${a.common2}｜環保 ${a.common3}｜節能 ${a.common4}`}
function updatePreview(){
  const n=80,a=allocate(n),secs=selectedSections(),pp=selectedProPool(secs).length;
  $('allocationPreview').textContent=previewText(a);
  $('roundWarn').classList.toggle('hidden',n%20===0);
  if(a.professional>pp)$('allocationPreview').textContent+=`（目前勾選的專業題庫只有 ${pp} 題，請減少題數或增加工作項目）`;
}
function poolFor(g,secs){return g==='professional'?selectedProPool(secs):usable.filter(q=>q.group===g)}
function startQuiz(config=null){
  const secs=config?.secs||selectedSections(); if(!secs.length){alert('請至少勾選一個專業工作項目。');return}
  let n=80;
  const allocation=allocate(n);
  for(const g of GROUP_ORDER){const avail=poolFor(g,secs).length;if(allocation[g]>avail){alert(`${GROUP_LABEL[g]}題庫目前可抽 ${avail} 題，但依比例需要 ${allocation[g]} 題。請減少總題數或增加專業工作項目。`);return}}
  mode=config?.mode||document.querySelector('input[name=mode]:checked').value;
  lastConfig={secs:[...secs],count:80,mode};lastAllocation=allocation;$('count').value=80;
  session=[];for(const g of GROUP_ORDER){session.push(...shuffled(poolFor(g,secs)).slice(0,allocation[g]))}session=shuffled(session);
  answers={};locked={};current=0;$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'});
}
function qMetaText(q){
  if(q.group==='professional')return `專業科目｜工作項目 ${String(q.section).padStart(2,'0')} ${q.sectionName}｜原題第 ${q.number} 題`;
  return `${q.groupName}｜原題第 ${q.number} 題`;
}
function render(){
  const q=session[current];if(!q)return;$('progressText').textContent=`第 ${current+1} / ${session.length} 題`;
  $('answeredText').textContent=`已答 ${Object.keys(answers).length} 題`;$('barFill').style.width=`${((current+1)/session.length)*100}%`;
  $('qMeta').textContent=qMetaText(q);$('qTitle').textContent=q.stem;
  $('visuals').innerHTML=(q.visuals||[]).map(src=>`<div class="visual"><img src="${src}" alt="原題圖示"></div>`).join('');
  const chosen=answers[q.id];$('choices').innerHTML=q.options.map((opt,i)=>{const num=i+1;let cls='choice';if(chosen===num)cls+=' selected';if(mode==='practice'&&locked[q.id]){if(num===q.answer)cls+=' correct';else if(chosen===num)cls+=' wrong'}const text=opt&&opt!=='。'?escapeHtml(opt):'<span style="color:#6d7c8d">請參考上方圖示</span>';return `<button type="button" class="${cls}" data-choice="${num}" ${mode==='practice'&&locked[q.id]?'disabled':''}><span class="n">${num}</span><span class="txt">${text}</span></button>`}).join('');
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));
  if(mode==='practice'&&locked[q.id])showFeedback(q,chosen);else $('feedback').classList.add('hidden');
  $('prevBtn').disabled=current===0;$('nextBtn').textContent=current===session.length-1?'已到最後一題':'下一題';const atEnd=current===session.length-1;
  $('submitBtn').classList.toggle('hidden',mode==='practice'?!atEnd:false);$('submitBtn').textContent=mode==='practice'?'完成本次練習':'交卷並計分';
}
function choose(n){const q=session[current];answers[q.id]=n;if(mode==='practice')locked[q.id]=true;render()}
function showFeedback(q,chosen){const f=$('feedback');f.classList.remove('hidden','ok','bad');if(chosen===q.answer){f.classList.add('ok');f.textContent='答對了！正解是 '+circ[q.answer-1]}else{f.classList.add('bad');f.textContent='答錯了。正解是 '+circ[q.answer-1]+' '+(q.options[q.answer-1]||'（請參考上方圖示）')}}
function move(d){const next=current+d;if(next<0||next>=session.length)return;current=next;render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(){let c=0,w=0,b=0;session.forEach(q=>{const a=answers[q.id];if(!a)b++;else if(a===q.answer)c++;else w++});const score=Math.round(c/session.length*100);$('scoreNum').textContent=score+'%';$('correctN').textContent=c;$('wrongN').textContent=w;$('blankN').textContent=b;$('resultMix').textContent=lastAllocation?previewText(lastAllocation):'';$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('reviewList').classList.add('hidden');$('reviewBtn').textContent='查看錯題';buildReview();window.scrollTo({top:0,behavior:'smooth'})}
function buildReview(){const bad=session.filter(q=>answers[q.id]!==q.answer);if(!bad.length){$('reviewList').innerHTML='<div class="feedback ok">全數答對，沒有錯題。</div>';return}$('reviewList').innerHTML=bad.map(q=>{const a=answers[q.id],your=a?circ[a-1]+' '+(q.options[a-1]||'（圖示選項）'):'未作答',ans=circ[q.answer-1]+' '+(q.options[q.answer-1]||'（圖示選項）');return `<div class="reviewItem"><span class="tagBad">${a?'答錯':'未答'}</span><div style="font-weight:800;margin-top:7px">${escapeHtml(qMetaText(q))}</div><div>${escapeHtml(q.stem)}</div><div class="answerLine">你的答案：${escapeHtml(your)}<br>正確答案：<b>${escapeHtml(ans)}</b></div></div>`}).join('')}
function toggleReview(){const x=$('reviewList');x.classList.toggle('hidden');$('reviewBtn').textContent=x.classList.contains('hidden')?'查看錯題':'收起錯題'}
function showSetup(){$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('setup').classList.remove('hidden');updatePreview();window.scrollTo({top:0,behavior:'smooth'})}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
init();
</script>
</body></html>
